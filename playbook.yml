---
- name: Deploy To Tomcat
  hosts: web
  become: yes
  tasks:
    - name: copy WAR file to Tomcat
      copy: 
        src: "/var/src/jenkins/5004/workspace/2023MavenWebAppPipelineWithAnsible/target/2023MavenWebAppPipelineWithAnsible.war"
        dest: "/opt/tomcat/webapps/2023MavenWebAppPipelineWithAnsible.war"
        remote_src: no
        
    - name: Restart Tomcat
      systemd: 
        name: tomcat
        state: restarted
